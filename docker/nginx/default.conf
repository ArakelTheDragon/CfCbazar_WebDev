# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name cfcbazar.8bit.ca www.cfcbazar.8bit.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl;
    server_name cfcbazar.8bit.ca www.cfcbazar.8bit.ca;

    root /var/www/html;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/cfcbazar.8bit.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cfcbazar.8bit.ca/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security: disable directory listing
    autoindex off;

    # Block sensitive folders → 403
    location ~* ^/(includes|private|vendor|system|PHPMailer|logs|docker|memory)(/|$) {
        deny all;
        return 403;
    }

    # Block admin.php and sensitive file types
    location ~* /(admin\.php|secrets\.php|\.env|\.ini|\.log|\.sql|\.bak|\.swp)$ {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;
    }
}
