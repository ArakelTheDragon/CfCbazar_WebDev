# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name cfcbazar.8bit.ca www.cfcbazar.8bit.ca;

    # Required for Certbot SSL renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl;
    server_name cfcbazar.8bit.ca www.cfcbazar.8bit.ca;

    root /var/www/html;
    index index.php index.html;

    # SSL certificates mounted from host /etc/letsencrypt
    ssl_certificate /etc/letsencrypt/live/cfcbazar.8bit.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cfcbazar.8bit.ca/privkey.pem;

    # SSL security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
