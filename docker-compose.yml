services:
  web:
    image: nginx:latest
    container_name: cfcbazar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-net

  php:
    build: .
    container_name: cfcbazar_php
    volumes:
      - .:/var/www/html
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: cfcbazar_mysql
    environment:
      MYSQL_DATABASE: cfcbazar_db
      MYSQL_ROOT_PASSWORD: 53098516
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cfcbazar_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 53098516
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
