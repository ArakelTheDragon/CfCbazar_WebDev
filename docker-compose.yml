services:
  web:
    image: nginx:latest
    container_name: cfcbazar_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-net

  php:
    build: .
    container_name: cfcbazar_php
    environment:
      - UMASK=0022
    volumes:
      - .:/var/www/html
    networks:
      - app-net

  db:
    image: mysql:8.0
    container_name: cfcbazar_mysql
    environment:
      MYSQL_DATABASE: cfcbazar_db
      MYSQL_ROOT_PASSWORD: 53098516
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cfcbazar_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 53098516
    networks:
      - app-net

  ftp:
    image: fauria/vsftpd
    container_name: cfcbazar_ftp
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=cfcbazar
      - FTP_PASS=53098516
      - PASV_ADDRESS=132.145.53.146
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - LOCAL_UMASK=022
    volumes:
      - .:/home/vsftpd/cfcbazar
    networks:
      - app-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
